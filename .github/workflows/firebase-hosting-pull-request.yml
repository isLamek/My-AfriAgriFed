# Tests and builds every pull request, and publishes a temporary preview
# website (a link is posted on the pull request). The live site is untouched
# until the pull request is merged. Same settings as firebase-hosting-merge.yml.

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: "true"
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL }}
          REACT_APP_CLOUDINARY_CLOUD_NAME: ${{ vars.REACT_APP_CLOUDINARY_CLOUD_NAME }}
          REACT_APP_CLOUDINARY_UPLOAD_PRESET: ${{ vars.REACT_APP_CLOUDINARY_UPLOAD_PRESET }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AFRIAGRIFED_EBC30 }}
          projectId: afriagrifed-ebc30
